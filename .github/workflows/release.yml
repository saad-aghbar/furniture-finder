name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install (compiles better-sqlite3 for Electron on Windows)
        run: npm ci
      - name: Lint & typecheck
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Package the app (unpacked)
        run: npx electron-builder --win dir --x64 --publish never
      - name: Smoke test the packaged app (Playwright e2e)
        env:
          FF_APP_EXE: ${{ github.workspace }}\release\win-unpacked\Furniture Finder.exe
          CI: '1'
        run: npx playwright test
      - name: Create the GitHub Release first (electron-builder can otherwise create it twice)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/<version>/$VERSION/g" .github/release-notes.md > notes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Furniture Finder $VERSION" --notes-file notes.md
      - name: Build the installer and publish it to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish always
      - name: Build the installer (dry run, no publishing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never
      - name: Upload installer (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 14
